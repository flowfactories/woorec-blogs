name: Build Hugo and Push to Blog Branch

on:
  push:
    tags:
      - '*'  # 匹配所有Tag，比如v1.0.0、prod-2026等
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Hugo source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '>=1.26'
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.159.1'
          extended: true
      
      - name: Build with Hugo
        run: hugo --minify --baseURL "https://woorec.com/blogs/"
      
      - name: Deploy to blog branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: blog  # 发布到 blog 分支
          commit_message: "Deploy Hugo: ${{ github.event.head_commit.message }}"
          keep_files: false  # 是否保留目标分支的旧文件